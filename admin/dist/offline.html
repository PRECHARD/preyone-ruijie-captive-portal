<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6a0dad" />
    <title>Offline · Preyone Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #1b0b2e 0%, #08080e 55%, #050505 100%);
        color: #f4f1fb;
        font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card {
        width: min(420px, 100%);
        padding: clamp(28px, 6vw, 44px);
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(18, 14, 28, 0.86);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      .mark {
        width: 84px;
        height: 84px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #ff007f, #a855f7, #00e5ff, #ff007f);
        box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
      }
      .mark img { width: 52px; height: 52px; display: block; }
      h1 { margin: 0 0 10px; font-size: 1.35rem; letter-spacing: 0.02em; }
      p { margin: 0 0 24px; color: #b9b3cc; line-height: 1.6; font-size: 0.95rem; }
      button {
        width: 100%;
        padding: 13px 20px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #a855f7, #6a0dad);
        color: #fff;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
      }
      button:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark"><img src="/boot-mark.png" alt="Preyone" width="52" height="52" /></div>
      <h1>You're offline</h1>
      <p>The Preyone Admin Console needs a connection for live vouchers, sessions and reports. Reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Retry connection</button>
    </main>
  </body>
</html>
