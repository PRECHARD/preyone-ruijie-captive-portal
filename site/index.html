    <style>

      #boot-loader{--bl-bg:#05060f;--bl-ring:#00d4ff,#7be0ff,#6a0dad,#ff00ff,#00d4ff;--bl-text:#7be0ff,#00d4ff,#ff00ff;--bl-glow-1:rgba(0,212,255,.30);--bl-glow-2:rgba(255,0,255,.20);--bl-font:'Montserrat',system-ui,-apple-system,sans-serif;position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(20px,5vh,40px);background:var(--bl-bg,#05060f);transition:opacity .4s ease,visibility .4s ease}
