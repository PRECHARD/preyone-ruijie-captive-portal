name: preyone-infra

services:
  postgres:
    image: postgres:15
    container_name: preyone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: captive_portal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d captive_portal"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - preyone

  redis:
    image: redis:7-alpine
    container_name: preyone-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - preyone

  freeradius:
    build: ./freeradius
    container_name: preyone-radius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "radiusd", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - preyone

volumes:
  pgdata:
  redisdata:

networks:
  preyone:
    driver: bridge