# Starlink customer portal — starlink.preyone.com
# Setup: point the DNS A/AAAA record at this host, then
#   sudo certbot --nginx -d starlink.preyone.com
# The Express app (subdomain branch in src/index.ts) serves the admin SPA
# bundle for this host; the portal itself lives at /starlink/portal.
server {
    listen 80;
    server_name starlink.preyone.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name starlink.preyone.com;

    ssl_certificate     /etc/letsencrypt/live/starlink.preyone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starlink.preyone.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# POS terminal — pos.preyone.com
# SPA bundle: pos/dist (served by the Express host router in src/index.ts, which
# also answers the index.html fallback for client-side routes).
server {
    listen 80;
    server_name pos.preyone.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pos.preyone.com;

    ssl_certificate     /etc/letsencrypt/live/pos.preyone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.preyone.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket passthrough (live dashboards / telemetry), falls back to
        # "close" for ordinary requests via the map at the top of this file.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $preyone_connection_upgrade;
        proxy_read_timeout 300s;
    }
}

