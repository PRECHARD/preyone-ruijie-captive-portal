# Preyone Captive Portal — nginx reverse proxy config
# Place in /etc/nginx/sites-available/preyone and symlink to sites-enabled
# Run: sudo nginx -t && sudo systemctl reload nginx
#
# Hosts served (all terminate TLS here, then proxy to the Express app which
# serves each SPA bundle and its index.html fallback — one source of truth for
# routing, so nginx only has to know the backend):
#   preyone.com / www        → site/dist        (marketing site)
#   wifi.preyone.com         → public/           (captive portal)
#   admin.preyone.com        → admin/dist        (admin console + invoicing)
#   starlink.preyone.com     → admin/dist        (Starlink customer portal)
#   pos.preyone.com          → pos/dist          (POS terminal)
#   app.preyone.com          → app/dist          (enterprise workspace launcher)
#   invoice.preyone.com      → invoice/dist      (invoicing workspace; override
#                                                 with INVOICE_DIST if the build
#                                                 lives outside the repo)
#   homeautomate.preyone.com → homeautomate/dist (IoT dashboard; override with
#                                                 HOMEAUTOMATE_DIST)
#
# Certificate setup for a new host:
#   sudo certbot --nginx -d <host>.preyone.com

# WebSocket upgrade passthrough (home automation telemetry, admin live views).
# Named with a Preyone prefix so it cannot collide with a map declared elsewhere.
map $http_upgrade $preyone_connection_upgrade {
    default upgrade;
    ''      close;
}

# Main site — preyone.com
server {
    listen 80;
    server_name preyone.com www.preyone.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name preyone.com www.preyone.com;

    ssl_certificate     /etc/letsencrypt/live/preyone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preyone.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Captive portal — wifi.preyone.com
server {
    listen 80;
