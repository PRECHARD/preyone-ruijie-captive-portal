# Invoicing workspace — invoice.preyone.com
# SPA bundle: invoice/dist (served by the Express host router in src/index.ts, which
# also answers the index.html fallback for client-side routes).
# If the invoicing suite is deployed as its own app, either copy its
# vite build output to invoice/dist or start the API with
# INVOICE_DIST=/absolute/path/to/dist so this host serves that bundle.
# 25m body limit covers logo uploads and generated PDFs.
