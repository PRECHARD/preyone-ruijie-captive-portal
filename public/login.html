<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Log In — Preyone UltraNet Wi-Fi</title>
  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Preyone" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0066ff" />
  <meta name="description" content="Log in to your Preyone UltraNet WiFi account to manage your data and bundles." />
  <link rel="manifest" href="/manifest.json" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800&family=Satisfy&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/portal.css?v=28" />
  <style>
    .login-container {
      max-width: 440px;
      margin: 4rem auto;
      padding: 2.5rem;
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .login-container h1 {
      font-family: var(--display);
      font-size: 2rem;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #7be0ff, var(--cyan) 40%, #ff7bfb, var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .login-container .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .login-container .field {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .login-container .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-container .field input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      color: #fff;
      font-family: var(--font);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .login-container .field input:focus {
      outline: none;
      border-color: var(--pink);
      background: rgba(255, 0, 255, 0.04);
      box-shadow: 0 0 0 2px rgba(255, 0, 255, 0.12), 0 0 20px rgba(255, 0, 255, 0.08);
    }
    .login-container .field input::placeholder { color: rgba(255, 255, 255, 0.3); }
    .login-container .field-error {
      font-size: 0.75rem;
      color: #e94560;
      margin-top: 0.3rem;
    }
    .login-btn {
      width: 100%;
      padding: 0.9rem;
      font-family: var(--display);
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #ff00cc 0%, #3333ff 50%, #00d4ff 100%);
      border: none;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(255, 0, 204, 0.3), 0 4px 20px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.15);
      box-shadow: 0 0 40px rgba(255, 0, 204, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
    }
    .login-btn:active { transform: translateY(0) scale(0.98); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .login-link a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 600;
    }
    .login-link a:hover { text-decoration: underline; }
    .login-error {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid #ff4444;
      color: #ff4444;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      text-align: center;
    }
    .login-success {
      background: rgba(37, 211, 102, 0.1);
      border: 1px solid #25d366;
      color: #25d366;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>

<body class="portal-body">
  <div class="portal-shell">
    <header class="portal-header">
      <div class="brand-banner">
        <picture class="brand-logo-picture">
          <source type="image/avif" srcset="/images/preyonenoneglow-logo-400.avif 400w, /images/preyonenoneglow-logo-800.avif 800w" sizes="(max-width: 800px) 100vw, 800px" />
          <source type="image/webp" srcset="/images/preyonenoneglow-logo-400.webp 400w, /images/preyonenoneglow-logo-800.webp 800w" sizes="(max-width: 800px) 100vw, 800px" />
          <img src="/images/preyonenoneglow-logo-400.png" alt="Preyone" class="brand-logo-img" width="1200" height="600" loading="eager" decoding="async" fetchpriority="high" />
        </picture>
      </div>
      <div class="brand-eyebrow brand-eyebrow--main">
        <span class="brand-signature">Fadaya nePreyone UltraNet Wifi</span>
      </div>
      <div class="header-auth">
        <a href="/" class="header-login-btn">Home</a>
      </div>
    </header>

    <div class="login-container">
      <h1>Log In</h1>
      <p class="subtitle">Sign in to your Preyone UltraNet account</p>

      <div id="login-error" class="login-error hidden"></div>
      <div id="login-success" class="login-success hidden"></div>

      <form id="login-form" method="POST" novalidate>
        <div class="field">
          <label for="loginEmail">Email or Phone Number</label>
          <input id="loginEmail" name="email" type="text" placeholder="you@example.com or 0771 234 567"
            autocomplete="username" required />
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" placeholder="Your password"
            autocomplete="current-password" required />
        </div>
        <button type="submit" id="login-submit-btn" class="login-btn">
          <span id="login-btn-text">Log In</span>
          <span id="login-btn-spinner" class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <p class="login-link">Don't have an account? <a href="/">Sign up</a></p>
      <p class="login-link"><a href="/forgot-password.html">Forgot password?</a></p>
    </div>

  </div>

  <!-- WhatsApp FAB -->
  <a href="https://wa.me/263771327202" class="whatsapp-fab" target="_blank" rel="noopener noreferrer" aria-label="Chat with us on WhatsApp" title="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L0 24l6.335-1.662c1.72.938 3.659 1.434 5.631 1.434h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
    </svg>
  </a>

  <script>
    // Login form handler
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var errorEl = document.getElementById('login-error');
      var successEl = document.getElementById('login-success');
      var btn = document.getElementById('login-submit-btn');
      var btnText = document.getElementById('login-btn-text');
      var spinner = document.getElementById('login-btn-spinner');
      
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');
      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      spinner.classList.remove('hidden');

      var emailOrPhone = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;
      
      var body = { password: password };
      if (emailOrPhone.includes('@')) {
        body.email = emailOrPhone;
      } else {
        body.phone = emailOrPhone;
      }

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        var json = await res.json();
        if (!res.ok) {
          errorEl.textContent = json.error || 'Login failed. Please try again.';
          errorEl.classList.remove('hidden');
          return;
        }
        // Success - store token and redirect
        if (json.token) {
          localStorage.setItem('portalToken', json.token);
          document.cookie = 'portal_token=' + json.token + '; path=/; domain=.preyone.com; max-age=604800; SameSite=Lax';
        }
        successEl.textContent = 'Login successful! Redirecting...';
        successEl.classList.remove('hidden');
        setTimeout(function() {
          window.location.href = '/manage-account';
        }, 1000);
      } catch (err) {
        console.error('Login error:', err);
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Log In';
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
