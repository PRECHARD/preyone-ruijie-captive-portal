<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — Voucher Success</title>
  <link rel="stylesheet" href="/css/portal.css?v=52" />
  <style>
    body { background: #050a1e; margin: 0; padding: 2rem; font-family: Montserrat, sans-serif; }
    .preview-wrap { max-width: 440px; margin: 0 auto; }
  </style>
</head>
<body>
  <style>#bootLoading{animation:boot-failsafe .4s ease 8s forwards}@keyframes boot-failsafe{to{opacity:0;visibility:hidden;pointer-events:none}}</style>
  <div class="body-loading" id="bootLoading" role="status" aria-live="polite">
    <div class="loading-spinner">
      <div class="loading-spinner-inner">
        <img src="/images/faviconloading-80.png" alt="Preyone" width="72" height="72" decoding="async" fetchpriority="high" />
      </div>
    </div>
    <div class="loading-text">Loading preview…</div>
  </div>
  <div class="preview-wrap">
    <div class="payment-modal" style="position:static;">
      <div class="pay-success">
        <div class="pay-success-icon" aria-hidden="true">&#10003;</div>
        <h3 class="pay-success-title">Payment complete!</h3>
        <p class="pay-success-sub">Your voucher code is ready. Enter it on the login page to connect.</p>
        <div class="pay-success-codebox">
          <span class="pay-success-codelabel">YOUR VOUCHER PIN</span>
          <div class="pay-success-coderow">
            <code class="pay-success-code">ct-abcd2345</code>
            <button type="button" class="pay-success-copy">Copy PIN</button>
          </div>
          <span class="pay-success-feedback" style="opacity:1;">Copied to Clipboard! &#10003;</span>
        </div>
        <p class="pay-success-hint">A login page will open automatically. If it does not, visit <strong>www.preyone.com</strong> on your device.</p>
      </div>
    </div>
  </div>
  <script>(function(){var e=document.getElementById('bootLoading');if(!e)return;var h=function(){e.classList.add('is-hidden')};if(document.readyState==='complete')h();else window.addEventListener('load',h);setTimeout(h,8e3)})();</script>
</body>
</html>
